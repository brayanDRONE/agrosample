services:
  # Backend Django
  - type: web
    name: agrosample-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input --clear"
    startCommand: "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DESCOLGADOS_USERNAME
        sync: false
      - key: DESCOLGADOS_PASSWORD
        sync: false

  # Worker serial para informes Chromium de cereza China (requiere plan pago de Background Worker).
  - type: worker
    name: agrosample-cherry-china-worker
    runtime: python
    rootDir: backend
    plan: 1c-2g
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium"
    startCommand: "python manage.py process_cherry_china_reports"
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: agrosample-backend
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: DESCOLGADOS_USERNAME
        sync: false
      - key: DESCOLGADOS_PASSWORD
        sync: false
